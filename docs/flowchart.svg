<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 780" width="1400" height="780" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#455a74"/>
    </marker>
    <marker id="arrowred" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
  </defs>
  <rect width="1400" height="780" fill="#ffffff"/>

  <text x="30" y="38" font-size="22" font-weight="700" fill="#1b2a3b">Chronos: from scan to signed fix</text>
  <text x="30" y="58" font-size="13" fill="#52627a">Discover, Prioritize, Fix, Sign. Diamonds are gates: if one fails, nothing is deployed.</text>

  <!-- stage tags -->
  <text x="30" y="92" font-size="11" font-weight="700" letter-spacing="1" fill="#2f5fbf">1  DISCOVER</text>
  <text x="950" y="92" font-size="11" font-weight="700" letter-spacing="1" fill="#2e7d4c">2  PRIORITIZE</text>
  <text x="720" y="292" font-size="11" font-weight="700" letter-spacing="1" fill="#b36b10">3  FIX</text>
  <text x="30" y="492" font-size="11" font-weight="700" letter-spacing="1" fill="#6b43aa">4  SIGN</text>

  <!-- ROW A: discover + start of prioritize -->
  <rect x="30" y="100" width="190" height="66" rx="8" fill="#e8f1ff" stroke="#5b8def" stroke-width="1.4"/>
  <text x="42" y="122" font-size="13" font-weight="700" fill="#1b2a3b">Scan files</text>
  <text x="42" y="140" font-size="11" fill="#43536a">configs, certificates, keys,</text>
  <text x="42" y="154" font-size="11" fill="#43536a">Python and Java source</text>

  <rect x="260" y="100" width="190" height="66" rx="8" fill="#e8f1ff" stroke="#5b8def" stroke-width="1.4"/>
  <text x="272" y="122" font-size="13" font-weight="700" fill="#1b2a3b">Probe handshakes</text>
  <text x="272" y="140" font-size="11" fill="#43536a">live TLS and SSH on</text>
  <text x="272" y="154" font-size="11" fill="#43536a">allow-listed channels</text>

  <rect x="490" y="100" width="190" height="66" rx="8" fill="#e8f1ff" stroke="#5b8def" stroke-width="1.4"/>
  <text x="502" y="122" font-size="13" font-weight="700" fill="#1b2a3b">Merge into findings</text>
  <text x="502" y="140" font-size="11" fill="#43536a">same fingerprint or</text>
  <text x="502" y="154" font-size="11" fill="#43536a">path + line = one asset</text>

  <rect x="720" y="100" width="190" height="66" rx="8" fill="#e8f1ff" stroke="#5b8def" stroke-width="1.4"/>
  <text x="732" y="122" font-size="13" font-weight="700" fill="#1b2a3b">Write the CBOM</text>
  <text x="732" y="140" font-size="11" fill="#43536a">CycloneDX 1.6 inventory,</text>
  <text x="732" y="154" font-size="11" fill="#43536a">45 assets in 1.2 s</text>

  <rect x="950" y="100" width="190" height="66" rx="8" fill="#e7f6ec" stroke="#4aa56b" stroke-width="1.4"/>
  <text x="962" y="122" font-size="13" font-weight="700" fill="#1b2a3b">Profile columns in-DB</text>
  <text x="962" y="140" font-size="11" fill="#43536a">aggregates only, no cell</text>
  <text x="962" y="154" font-size="11" fill="#43536a">values leave the database</text>

  <rect x="1180" y="100" width="190" height="66" rx="8" fill="#e7f6ec" stroke="#4aa56b" stroke-width="1.4"/>
  <text x="1192" y="122" font-size="13" font-weight="700" fill="#1b2a3b">Snap ML labels data</text>
  <text x="1192" y="140" font-size="11" fill="#43536a">policy table turns the</text>
  <text x="1192" y="154" font-size="11" fill="#43536a">label into years X</text>

  <line x1="220" y1="133" x2="260" y2="133" stroke="#455a74" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="450" y1="133" x2="490" y2="133" stroke="#455a74" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="680" y1="133" x2="720" y2="133" stroke="#455a74" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="910" y1="133" x2="950" y2="133" stroke="#455a74" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="1140" y1="133" x2="1180" y2="133" stroke="#455a74" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="1275" y1="166" x2="1275" y2="300" stroke="#455a74" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- stubs above diamonds -->
  <rect x="30" y="215" width="190" height="40" rx="8" fill="#fdecec" stroke="#c0392b" stroke-width="1.3"/>
  <text x="125" y="239" font-size="11.5" text-anchor="middle" fill="#7b241c">Failed: nothing deployed</text>
  <rect x="490" y="215" width="190" height="40" rx="8" fill="#fdecec" stroke="#c0392b" stroke-width="1.3"/>
  <text x="585" y="239" font-size="11.5" text-anchor="middle" fill="#7b241c">Rejected: reason shown</text>

  <!-- ROW B: prioritize + fix, right to left -->
  <rect x="1180" y="300" width="190" height="66" rx="8" fill="#e7f6ec" stroke="#4aa56b" stroke-width="1.4"/>
  <text x="1192" y="322" font-size="13" font-weight="700" fill="#1b2a3b">Mosca test</text>
  <text x="1192" y="340" font-size="11" fill="#43536a">M = X + Y - Z per channel</text>
  <text x="1192" y="354" font-size="11" fill="#43536a">exposed if M &gt; 0 + classical</text>

  <rect x="950" y="300" width="190" height="66" rx="8" fill="#e7f6ec" stroke="#4aa56b" stroke-width="1.4"/>
  <text x="962" y="322" font-size="13" font-weight="700" fill="#1b2a3b">Rank by priority</text>
  <text x="962" y="340" font-size="11" fill="#43536a">0 to 100 from margin,</text>
  <text x="962" y="354" font-size="11" fill="#43536a">records, reach, scenarios</text>

  <rect x="720" y="300" width="190" height="66" rx="8" fill="#fff3e0" stroke="#e09b3d" stroke-width="1.4"/>
  <text x="732" y="322" font-size="13" font-weight="700" fill="#1b2a3b">Granite picks template</text>
  <text x="732" y="340" font-size="11" fill="#43536a">choice only, rules fallback</text>
  <text x="732" y="354" font-size="11" fill="#43536a">if it does not answer</text>

  <polygon points="585,285 680,333 585,381 490,333" fill="#fff9ee" stroke="#e09b3d" stroke-width="1.5"/>
  <text x="585" y="330" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1b2a3b">Validator</text>
  <text x="585" y="346" font-size="11" text-anchor="middle" fill="#43536a">all checks pass?</text>

  <rect x="260" y="300" width="190" height="66" rx="8" fill="#fff3e0" stroke="#e09b3d" stroke-width="1.4"/>
  <text x="272" y="322" font-size="13" font-weight="700" fill="#1b2a3b">Sandbox test</text>
  <text x="272" y="340" font-size="11" fill="#43536a">hybrid handshake, legacy</text>
  <text x="272" y="354" font-size="11" fill="#43536a">client, health check</text>

  <polygon points="125,285 220,333 125,381 30,333" fill="#fff9ee" stroke="#e09b3d" stroke-width="1.5"/>
  <text x="125" y="330" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1b2a3b">Sandbox</text>
  <text x="125" y="346" font-size="11" text-anchor="middle" fill="#43536a">checks pass?</text>

  <line x1="1180" y1="333" x2="1140" y2="333" stroke="#455a74" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="950" y1="333" x2="910" y2="333" stroke="#455a74" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="720" y1="333" x2="680" y2="333" stroke="#455a74" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="490" y1="333" x2="450" y2="333" stroke="#455a74" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="470" y="325" font-size="11" text-anchor="middle" fill="#2e7d4c">yes</text>
  <line x1="260" y1="333" x2="220" y2="333" stroke="#455a74" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="585" y1="285" x2="585" y2="255" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrowred)"/>
  <text x="597" y="272" font-size="11" fill="#c0392b">no</text>
  <line x1="125" y1="285" x2="125" y2="255" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrowred)"/>
  <text x="137" y="272" font-size="11" fill="#c0392b">no</text>
  <line x1="125" y1="381" x2="125" y2="500" stroke="#455a74" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="137" y="440" font-size="11" fill="#2e7d4c">yes</text>

  <!-- ROW C: sign -->
  <rect x="30" y="500" width="190" height="66" rx="8" fill="#f0e9fb" stroke="#8a63c7" stroke-width="1.4"/>
  <text x="42" y="522" font-size="13" font-weight="700" fill="#1b2a3b">Human approval</text>
  <text x="42" y="540" font-size="11" fill="#43536a">secops reviews the diff,</text>
  <text x="42" y="554" font-size="11" fill="#43536a">hashes and sandbox log</text>

  <rect x="260" y="500" width="190" height="66" rx="8" fill="#f0e9fb" stroke="#8a63c7" stroke-width="1.4"/>
  <text x="272" y="522" font-size="13" font-weight="700" fill="#1b2a3b">Apply to the service</text>
  <text x="272" y="540" font-size="11" fill="#43536a">rebuild the container,</text>
  <text x="272" y="554" font-size="11" fill="#43536a">rerun the checks</text>

  <polygon points="585,485 680,533 585,581 490,533" fill="#f8f3fd" stroke="#8a63c7" stroke-width="1.5"/>
  <text x="585" y="530" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1b2a3b">Post-deploy</text>
  <text x="585" y="546" font-size="11" text-anchor="middle" fill="#43536a">checks pass?</text>

  <rect x="720" y="500" width="190" height="66" rx="8" fill="#f0e9fb" stroke="#8a63c7" stroke-width="1.4"/>
  <text x="732" y="522" font-size="13" font-weight="700" fill="#1b2a3b">Rescan</text>
  <text x="732" y="540" font-size="11" fill="#43536a">new CBOM, evidence</text>
  <text x="732" y="554" font-size="11" fill="#43536a">archived with hashes</text>

  <rect x="950" y="500" width="190" height="66" rx="8" fill="#f0e9fb" stroke="#8a63c7" stroke-width="1.4"/>
  <text x="962" y="522" font-size="13" font-weight="700" fill="#1b2a3b">Sign</text>
  <text x="962" y="540" font-size="11" fill="#43536a">ML-DSA-65 attestation,</text>
  <text x="962" y="554" font-size="11" fill="#43536a">chained to the previous entry</text>

  <rect x="1180" y="500" width="190" height="66" rx="8" fill="#ffffff" stroke="#6b7c93" stroke-width="1.4"/>
  <text x="1192" y="522" font-size="13" font-weight="700" fill="#1b2a3b">Exposure updated</text>
  <text x="1192" y="540" font-size="11" fill="#43536a">E and R recomputed and</text>
  <text x="1192" y="554" font-size="11" fill="#43536a">shown on the dashboard</text>

  <rect x="490" y="620" width="190" height="40" rx="8" fill="#fdecec" stroke="#c0392b" stroke-width="1.3"/>
  <text x="585" y="644" font-size="11.5" text-anchor="middle" fill="#7b241c">Roll back: restore the file</text>

  <line x1="220" y1="533" x2="260" y2="533" stroke="#455a74" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="450" y1="533" x2="490" y2="533" stroke="#455a74" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="680" y1="533" x2="720" y2="533" stroke="#455a74" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="700" y="525" font-size="11" text-anchor="middle" fill="#2e7d4c">yes</text>
  <line x1="910" y1="533" x2="950" y2="533" stroke="#455a74" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="1140" y1="533" x2="1180" y2="533" stroke="#455a74" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="585" y1="581" x2="585" y2="620" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrowred)"/>
  <text x="597" y="604" font-size="11" fill="#c0392b">no</text>

  <!-- legend and notes -->
  <rect x="30" y="700" width="14" height="14" fill="#e8f1ff" stroke="#5b8def"/><text x="50" y="712" font-size="12" fill="#43536a">Discover</text>
  <rect x="130" y="700" width="14" height="14" fill="#e7f6ec" stroke="#4aa56b"/><text x="150" y="712" font-size="12" fill="#43536a">Prioritize</text>
  <rect x="240" y="700" width="14" height="14" fill="#fff3e0" stroke="#e09b3d"/><text x="260" y="712" font-size="12" fill="#43536a">Fix</text>
  <rect x="310" y="700" width="14" height="14" fill="#f0e9fb" stroke="#8a63c7"/><text x="330" y="712" font-size="12" fill="#43536a">Sign</text>
  <rect x="390" y="700" width="14" height="14" fill="#fdecec" stroke="#c0392b"/><text x="410" y="712" font-size="12" fill="#43536a">Stop</text>
  <text x="30" y="740" font-size="12" fill="#43536a">Nothing reaches the demo stack unless every gate passes and a human approves. Granite never writes files: it only picks a template and its parameters.</text>
  <text x="30" y="760" font-size="12" fill="#43536a">Figures shown (45 assets, 1.2 s) were measured on the synthetic St. Aster General stack on IBM LinuxONE.</text>
</svg>
