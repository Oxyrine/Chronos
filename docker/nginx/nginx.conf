events {}
http {
    resolver 127.0.0.11 valid=10s ipv6=off;
    server {
        set $chronos_api chronos-api:8000;
        listen 9443 ssl;
        ssl_certificate /keys/server.crt;
        ssl_certificate_key /keys/server.key;
        ssl_protocols TLSv1.3;
        ssl_ecdh_curve X25519MLKEM768:X25519;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'" always;
        location /api/ {
            proxy_pass http://$chronos_api;
            proxy_read_timeout 300s;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
        location = /health {
            # A location with its own add_header inherits none from the server block, so repeat them.
            add_header Strict-Transport-Security "max-age=31536000" always;
            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy no-referrer always;
            add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'" always;
            add_header X-TLS-Group $ssl_curve always;
            proxy_pass http://$chronos_api/health;
        }
        root /dashboard;
        location / { try_files $uri $uri/ /index.html; }
    }
}
