worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr info;
events { worker_connections 256; }
http {
    log_format chronos escape=json '{"time":"$time_iso8601","remote_addr":"$remote_addr","request_uri":"$request_uri","status":$status,"bytes_sent":$bytes_sent,"request_time":$request_time,"ssl_protocol":"$ssl_protocol","ssl_cipher":"$ssl_cipher","ssl_curve":"$ssl_curve","ssl_curves":"$ssl_curves","record_count":"$upstream_http_x_record_count"}';
    access_log /var/log/nginx/chronos.log chronos;
    server {
        listen 8443 ssl;
        server_name portal portal.staster.test sandbox-portal;
        ssl_certificate /keys/server.crt;
        ssl_certificate_key /keys/server.key;
        ssl_protocols TLSv1.3 TLSv1.2;
        ssl_ecdh_curve X25519:prime256v1;
        ssl_session_cache off;
        location = /health { proxy_pass http://portal-app:8000; }
        location / { proxy_pass http://portal-app:8000; }
    }
}
